name: edusnap
description: EduSnap offline photo journal
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  package_info_plus: ^8.0.0
  itchi_flutter_duo_layout:
    git:
      url: https://github.com/itchitechhk/itchi_flutter_duo_layout.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_1024.png"
  adaptive_icon_background: "#27397F"
  adaptive_icon_foreground: "assets/icon/icon_1024.png"
  remove_alpha_ios: true